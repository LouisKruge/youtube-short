# Fly.io deployment for the Nexus Clips worker.
#
# Run from this directory:
#
#   fly launch --no-deploy --copy-config
#   fly secrets set WORKER_SHARED_SECRET=... SUPABASE_URL=... \
#     SUPABASE_SERVICE_ROLE_KEY=... OPENAI_API_KEY=... ANTHROPIC_API_KEY=...
#   fly deploy
#
# THEN FIND THE REAL HOSTNAME — do not assume it matches the name below:
#
#   fly apps list          # or: fly status
#
# Fly app names are globally unique across every Fly account, so `launch` will
# have given you something else if this one was taken, and it rewrites the
# `app =` line here when it does. Put that hostname in WORKER_URL on Vercel,
# along with the same WORKER_SHARED_SECRET, and redeploy.
#
# A WORKER_URL that "does not resolve" means no app exists at that name. A
# stopped app still resolves — you would get a refused connection instead.

# PLACEHOLDER. `fly launch` replaces this with whatever name you are actually
# given. Never copy it into WORKER_URL without checking `fly apps list` first.
app = "nexus-clips-worker"
# Dublin, to sit in the same region as the Supabase project (eu-west-1). This
# worker pushes and pulls multi-gigabyte media to Storage on every job, so
# co-locating is worth more here than it would be for a normal API service.
primary_region = "dub"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MEDIA_DIR = "/data/nexus-media"

[http_service]
  internal_port = 8080
  force_https = true
  # The worker must stay up: it polls Supabase for queued jobs on its own
  # schedule. A machine that has been suspended is a queue that never drains,
  # and the nudge from the app is an optimisation, not the trigger.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# A two-hour source is downloaded whole, decoded for the envelope, then encoded
# twice per clip. 1 GB is not enough for 1080x1920 x264; 4 GB leaves headroom
# for a long source and the scratch files beside it.
#
# Starting on shared CPU because the load is bursty — a few sources a day, not a
# continuous stream — and shared instances burst well for that shape. If encodes
# feel slow, or you start batching, move to `performance-1x`: ffmpeg will run at
# 100% for minutes at a time and shared CPU is throttled to its baseline share
# once the burst credit is gone. That is the one dial worth turning here.
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"

# Video is written to disk before it goes to Storage. Fly's rootfs is small and
# ephemeral — a real volume keeps a long source from filling the machine.
[mounts]
  source = "nexus_media"
  destination = "/data"
