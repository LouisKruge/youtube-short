# Fly.io deployment for the Nexus Clips worker.
#
# Run from this directory, in this order:
#
#   fly launch --no-deploy --copy-config    # takes the name below
#
#   # The [mounts] block below needs a volume that already exists, in the same
#   # region as the app. `fly deploy` fails outright without it, and the error
#   # does not obviously point here.
#   fly volumes create nexus_media --size 20 --region lhr
#
#   fly secrets set WORKER_SHARED_SECRET=... SUPABASE_URL=... \
#     SUPABASE_SERVICE_ROLE_KEY=... OPENAI_API_KEY=... ANTHROPIC_API_KEY=...
#
#   fly deploy
#
# THEN FIND THE REAL HOSTNAME — do not assume it matches the name below:
#
#   fly apps list          # or: fly status
#
# Fly app names are globally unique across every Fly account, so `launch` will
# have given you something else if this one was taken, and it rewrites the
# `app =` line here when it does. Put that hostname in WORKER_URL on Vercel,
# along with the same WORKER_SHARED_SECRET, and redeploy.
#
# A WORKER_URL that "does not resolve" means no app exists at that name. A
# stopped app still resolves — you would get a refused connection instead.

# A concrete name with a random suffix, so it is almost certainly free on Fly
# and the hostname is knowable before deploying: https://nexus-clips-worker-30af5d.fly.dev
#
# Fly app names are globally unique across every account. If `fly launch` still
# says this one is taken, change it here, and the URL changes to match.
app = "nexus-clips-worker-30af5d"
# London: the closest Fly region to the Supabase project, which is in AWS
# eu-west-1 (Ireland). This worker pushes and pulls multi-gigabyte media to
# Storage on every job, so staying on the same side of the Atlantic is worth
# more here than it would be for an ordinary API service.
#
# Fly has no Dublin region - an earlier version of this file said "dub", which
# is not a Fly region code at all and fails at app creation. `fly platform
# regions` prints the real list; ams and cdg are the next-nearest alternatives.
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MEDIA_DIR = "/data/nexus-media"

[http_service]
  internal_port = 8080
  force_https = true
  # The worker must stay up: it polls Supabase for queued jobs on its own
  # schedule. A machine that has been suspended is a queue that never drains,
  # and the nudge from the app is an optimisation, not the trigger.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# Sized from measurement, not from caution. Peak resident memory of each ffmpeg
# stage, against a real 1080p source:
#
#   loudness envelope (decodes the whole file)     57 MB
#   scene detection                               113 MB
#   cut a 30s clip                                375 MB
#   crop to 1080x1920 vertical                    442 MB
#
# 442 MB is the ceiling, plus roughly 100 MB for the Node process. 2 GB is
# three times that. An earlier version of this file said 4 GB, which was a guess
# and wrong by an order of magnitude — it is the single largest thing driving
# the bill, so it was worth measuring.
#
# Memory does not grow with source length. ffmpeg streams, so a two-hour file
# costs the same RAM as a five-minute one; only the frame size matters. Length
# drives *disk*, which is what the volume below is for.
#
# A dedicated core, because shared was measurably not enough.
#
# Scene detection decodes the source end to end, and decoding is essentially
# the whole cost of that stage — measured on 1080p30, decode alone is 49.9s of
# a 52.1s pass, so no filter change moves it. On shared-cpu-1x a 1h49m source
# failed to finish that pass in 30 minutes, i.e. under 3.6x realtime. The same
# work runs at ~6x realtime on one unthrottled core.
#
# Shared vCPUs burst and then throttle to a baseline. That is the wrong shape
# for ffmpeg, which sits at 100% for minutes at a stretch and spends most of a
# job past the point where the credit is gone.
#
# This costs real money and a dedicated core is several times the price of a
# shared one for the same RAM — check fly.io/docs/about/pricing for the current
# figure. The load here is bursty (a few sources a day, not a continuous
# stream), so scaling back down between batches is legitimate:
#
#   fly scale vm shared-cpu-1x --app nexus-clips-worker-30af5d
#
# Whatever is set here wins on the next deploy, so change this line rather than
# relying on `fly scale` alone - otherwise the next deploy quietly reverts it.
#
# Memory stays at 2 GB: measured peak resident is 442 MB (the vertical crop),
# and it does not grow with source length because ffmpeg streams.
[[vm]]
  size = "performance-1x"
  memory = "2gb"

# Video is written to disk before it goes to Storage. Fly's rootfs is small and
# ephemeral — a real volume keeps a long source from filling the machine.
#
# This volume must be created before the first deploy (see the header). 20 GB
# holds a long source plus the clips cut from it with room to spare; the files
# are deleted after each job, so this is working space, not storage.
[mounts]
  source = "nexus_media"
  destination = "/data"
